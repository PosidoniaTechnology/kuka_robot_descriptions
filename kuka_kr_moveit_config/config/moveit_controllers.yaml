/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    moveit_simple_controller_manager:
      controller_names:
        - kuka_arm_controller
        - gripper_controller

      kuka_arm_controller:
        action_ns: follow_joint_trajectory
        type: FollowJointTrajectory
        default: true
        joints:
          - joint_1
          - joint_2
          - joint_3
          - joint_4
          - joint_5
          - joint_6

      gripper_controller:
            action_ns: gripper_cmd
            type: GripperCommand
            default: true
            joints:
              - robotiq_hand_e_left_finger_joint
              - robotiq_hand_e_right_finger_joint
            command_joint:
              - robotiq_hand_e_left_finger_joint
